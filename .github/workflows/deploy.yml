# Builds the image on the runner and deploys it to the VM over SSH, without a
# registry: docker save | zstd | ssh vm 'zstd -d | docker load'.
#
# Repository secrets:
#   SSH_PRIVATE_KEY         private key of DEPLOY_USER on the VM
#   SSH_KNOWN_HOSTS         the VM's host keys: ssh-keyscan -p <port> <host>
#   BLIZZARD_CLIENT_ID      Blizzard API client
#   BLIZZARD_CLIENT_SECRET
#   POSTGRES_PASSWORD       database password (used only when the database is
#                           first created; avoid characters like @ / : ? # %)
#
# The secrets are sent to `docker compose up` through SSH stdin as environment
# variables; no .env file is written on the VM. The VM needs Docker with the
# compose plugin and zstd, and DEPLOY_USER must be allowed to run docker.

name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: greedygoblin-data-server
  TAG: ${{ github.sha }}
  DEPLOY_USER: luca
  DEPLOY_HOST: pestering-curiosity.com
  DEPLOY_PORT: 2008
  DEPLOY_DIR: /home/luca/ci/greedygoblin-data-server
  DEPLOY_VOLUMES_DIR: /docker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      # Configure SSH
        run: |
          command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${DEPLOY_PORT} ${DEPLOY_HOST} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy image to the VM
        run: |
          docker save "$IMAGE:$TAG" "$IMAGE:latest" \
            | zstd -T0 -3 \
            | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'zstd -d | docker load'

      - name: Copy compose file to the VM
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_DIR'"
          scp -P "$DEPLOY_PORT" docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/docker-compose.yml"

      - name: Start services
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" " \
            cd '$DEPLOY_DIR' && \
            echo -e \"
            DEPLOY_VOLUMES_DIR=${DEPLOY_VOLUMES_DIR}
            BLIZZARD_CLIENT_ID=${{ secrets.BLIZZARD_CLIENT_ID }}
            BLIZZARD_CLIENT_SECRET=${{ secrets.BLIZZARD_CLIENT_SECRET }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            \" > .env && \
            IMAGE_TAG='$TAG' docker compose up -d --remove-orphans"

      - name: Remove old images
        # Keep the deployed image and "latest"; disk on the VM is limited.
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker images '$IMAGE' --format '{{.Tag}}' \
            | grep -vxE 'latest|$TAG' \
            | xargs -r -I{} docker rmi '$IMAGE:{}'; docker image prune -f"
