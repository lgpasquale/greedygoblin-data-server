# Builds the image on the runner and deploys it to the VM over SSH, without a
# registry: docker save | zstd | ssh vm 'zstd -d | docker load'.
#
# Repository settings:
#   secrets.SSH_PRIVATE_KEY  private key of the deploy user on the VM
#   secrets.SSH_KNOWN_HOSTS  the VM's host key line(s) (ssh-keyscan <host>)
#   vars.SSH_TARGET          user@host
#   vars.DEPLOY_PATH         directory on the VM with docker-compose.yml and .env
#
# The VM needs Docker with the compose plugin and zstd. The deploy user must be
# allowed to run docker. .env on the VM is created by hand (see .env.example).

name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: wow-data-server
  TAG: ${{ github.sha }}
  SSH_TARGET: ${{ vars.SSH_TARGET }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  BatchMode yes\n' > ~/.ssh/config

      - name: Copy image to the VM
        run: |
          docker save "$IMAGE:$TAG" "$IMAGE:latest" \
            | zstd -T0 -3 \
            | ssh "$SSH_TARGET" 'zstd -d | docker load'

      - name: Copy compose file to the VM
        run: scp docker-compose.yml "$SSH_TARGET:$DEPLOY_PATH/docker-compose.yml"

      - name: Start services
        run: |
          ssh "$SSH_TARGET" "cd '$DEPLOY_PATH' && IMAGE_TAG='$TAG' docker compose up -d --remove-orphans"

      - name: Remove old images
        # Keep the deployed image and "latest"; disk on the VM is limited.
        run: |
          ssh "$SSH_TARGET" "docker images '$IMAGE' --format '{{.Tag}}' \
            | grep -vxE 'latest|$TAG' \
            | xargs -r -I{} docker rmi '$IMAGE:{}'; docker image prune -f"
